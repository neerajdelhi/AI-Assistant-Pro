<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7v10c0 5.55 3.84 9.74 9 11 5.16-1.26 9-5.45 9-11V7l-10-5z"/>
          <path d="M12 22V12"/>
          <path d="M8 12h8"/>
        </svg>
        <h1>AI Assistant Pro</h1>
      </div>
      <div class="header-buttons">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="settings-btn" id="openSettingsHeader" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="onboarding" id="onboarding">
      <p>Welcome! Select text on any page and use the AI actions below.</p>
      <button id="dismissOnboarding">Got it!</button>
    </div>

    <div class="api-warning" id="apiWarning">
      <p>Please set your API keys in extension settings.</p>
      <button id="openSettings">Open Settings</button>
    </div>

    <div class="provider-section">
<select id="providerSelect" class="provider-select">
          <option value="auto">🤖 Auto (Best available)</option>
          <option value="groq">⚡ Groq (Free tier)</option>
          <option value="openrouter">🌐 OpenRouter (Free models)</option>
          <option value="nvidia">🔮 NVIDIA Nemotron</option>
          <option value="gemini">💎 Gemini</option>
          <option value="openai">🔒 OpenAI</option>
          <option value="anthropic">🟣 Anthropic Claude</option>
          <option value="poolside">🏖️ Poolside Laguna</option>
          <option value="ollama">💻 Ollama (Local)</option>
          <option value="lmstudio">🖥️ LM Studio (Local)</option>
        </select>
      <div id="providerStatus" class="provider-status">Checking...</div>
    </div>

    <div class="input-section">
      <textarea id="userInput" placeholder="Ask about the webpage or type your question..." rows="3"></textarea>
      <div class="actions-row">
        <select id="actionType">
          <option value="ask">Ask Question</option>
          <option value="summarize">Summarize</option>
          <option value="rewrite">Rewrite</option>
          <option value="translate">Translate</option>
          <option value="email">Email Reply</option>
        </select>
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
    </div>

    <div class="response-section" id="responseSection">
      <div class="response-header">
        <h3>Response</h3>
        <button class="copy-btn" id="copyBtn" title="Copy">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div class="response-content" id="responseContent">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span>Processing...</span>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
