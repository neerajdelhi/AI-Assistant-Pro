<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Pro - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Assistant Pro Settings</h1>
      <p>Configure your AI assistant preferences</p>
    </header>

    <section class="settings-section">
      <h2>API Configuration</h2>
      <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <div class="api-input-container">
          <input type="password" id="apiKey" placeholder="Enter your Gemini API key">
          <button id="toggleApiKey" title="Show/Hide API key">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="help-text">
          Get your free API key from 
          <a href="https://makersuite.google.com/app/apikeys" target="_blank">Google AI Studio</a>
        </p>
      </div>
      <button id="saveApiKey" class="primary-btn">Save API Key</button>
    </section>

    <section class="settings-section">
      <h2>Appearance</h2>
      <div class="form-group">
        <label>Theme</label>
        <div class="theme-options">
          <button class="theme-option" data-theme="light">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            Light
          </button>
          <button class="theme-option" data-theme="dark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            Dark
          </button>
          <button class="theme-option" data-theme="system">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="2" y1="9" x2="22" y2="9"/>
              <line x1="2" y1="15" x2="22" y2="15"/>
            </svg>
            System
          </button>
        </div>
      </div>
    </section>

    <section class="settings-section">
      <h2>Data Management</h2>
      <button id="clearHistory" class="secondary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Clear Conversation History
      </button>
      <button id="resetSettings" class="secondary-btn danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
        </svg>
        Reset All Settings
      </button>
    </section>

    <section class="settings-section">
      <h2>Keyboard Shortcuts</h2>
      <div class="shortcut-info">
        <kbd>Ctrl+Shift+A</kbd> <span>Toggle AI Assistant sidebar</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>About</h2>
      <p class="version">Version 1.0.0</p>
      <p class="privacy-link">
        <a href="#" id="showPrivacy">Privacy Policy</a>
      </p>
    </section>

    <div class="status-message" id="statusMessage"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
